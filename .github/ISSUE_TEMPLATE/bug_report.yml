name: Bug report
description: Report a reproducible Qunta defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Qunta. Remove secrets, tokens, private prompts, and personal data before submitting.
  - type: input
    id: version
    attributes:
      label: Qunta version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Desktop UI
        - Tauri or Rust core
        - Workspace sandbox
        - Codex runtime
        - Cloud API
        - LLM gateway
        - Packaging or updates
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start from...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe logs or screenshots
      description: Remove credentials, private paths, prompts, and customer data.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This is not a security vulnerability. Security reports follow SECURITY.md.
          required: true
