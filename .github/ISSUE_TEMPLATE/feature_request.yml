name: Feature request
description: Propose a focused improvement to Qunta
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem first. Large architectural changes should be discussed before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who is affected, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior or capability, not only an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Desktop UI
        - Tauri or Rust core
        - Workspace safety
        - Agent runtime
        - Cloud API
        - LLM gateway
        - Packaging or updates
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      placeholder: |
        - [ ] Observable result
        - [ ] Tests or verification
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This request does not include secrets, private data, or provider credentials.
          required: true
